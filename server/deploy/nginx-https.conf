server {
    listen 80;
    listen [::]:80;
    server_name aihekele.xyz 110.40.204.102;
    access_log off;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /lzzx/project/clearframe/shared/acme;
        default_type text/plain;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 135s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aihekele.xyz;
    access_log off;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /lzzx/erv/certbot/config/live/aihekele.xyz/fullchain.pem;
    ssl_certificate_key /lzzx/erv/certbot/config/live/aihekele.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ClearFrameSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 135s;
        proxy_buffering off;
    }
}
